[Camera]
; Right stick camera, independent of the left stick and Select.
; SensitivityPercent: 1 to 300. 100 matches the original analog range.
SensitivityPercent=100
; XInput stick units, from 0 to 30000. 8689 prevents typical Xbox stick drift.
DeadZone=8689
; 0 = standard vertical direction, 1 = reverse it.
InvertY=0
; 1 reverses the right stick's horizontal direction.
InvertX=1
; Independent trigger zoom: left = out, right = in.
TriggerZoom=1
; Ignore slight trigger pressure (0 to 254).
TriggerThreshold=30
; Click right stick to reset the camera.
RightStickReset=1
; Start acts as Escape for the pause menu and menu back/cancel.
StartMenu=1
